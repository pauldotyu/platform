apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: agent-environment
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: XAgentEnvironment
  mode: Pipeline
  pipeline:
  - step: environment
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
          - type: Reference
            ref:
              name: workload
  - step: render-opentofu-workspace
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $env := index .context "apiextensions.crossplane.io/environment" }}
          apiVersion: opentofu.m.upbound.io/v1beta1
          kind: Workspace
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: opentofu-workspace
          spec:
            providerConfigRef:
              kind: ClusterProviderConfig
              name: provider-opentofu
            forProvider:
              source: Remote
              module: github.com/pauldotyu/platform//modules/agent-environment?ref=main
              vars:
              - key: team
                value: {{ .observed.composite.resource.spec.parameters.team | quote }}
              - key: project
                value: {{ .observed.composite.resource.spec.parameters.project | quote }}
              - key: environment
                value: {{ .observed.composite.resource.spec.parameters.environment | quote }}
              - key: location
                value: {{ .observed.composite.resource.spec.parameters.location | quote }}
              - key: requester_object_id
                value: {{ .observed.composite.resource.spec.parameters.requesterObjectId | quote }}
              - key: cost_center
                value: {{ .observed.composite.resource.spec.parameters.costCenter | quote }}
              - key: shared_cluster_id
                value: {{ $env.clusterId | quote }}
              - key: shared_cluster_oidc_issuer_url
                value: {{ $env.clusterOidcIssuerUrl | quote }}
              - key: shared_cluster_location
                value: {{ $env.location | quote }}
              - key: shared_monitor_workspace_id
                value: {{ $env.monitorWorkspaceId | quote }}
              - key: shared_log_analytics_workspace_id
                value: {{ $env.logAnalyticsWorkspaceId | quote }}
              - key: shared_model_resource_id
                value: {{ $env.modelResourceId | quote }}
              - key: shared_model_resource_name
                value: {{ $env.modelResourceName | quote }}
          
          {{- $workspace := getComposedResource . "opentofu-workspace" }}
          {{- $outputs := dig "status" "atProvider" "outputs" (dict) ($workspace | default (dict)) }}
          {{- $namespace := get $outputs "namespace_name" }}
          {{- $clientId := get $outputs "workload_identity_client_id" }}
          {{- $serviceAccountName := get $outputs "foundry_service_account_name" }}
          {{- $resourceGroupId := dig "status" "atProvider" "outputs" "resource_group_id" "" ($workspace | default (dict)) }}
          {{- $logsEndpoint := dig "status" "atProvider" "outputs" "otel_logs_endpoint" "" ($workspace | default (dict)) }}
          {{- $metricsEndpoint := dig "status" "atProvider" "outputs" "otel_metrics_endpoint" "" ($workspace | default (dict)) }}
          {{- $tracesEndpoint := dig "status" "atProvider" "outputs" "otel_traces_endpoint" "" ($workspace | default (dict)) }}
          {{- $modelEndpoint := dig "status" "atProvider" "outputs" "foundry_openai_base_url" "" ($workspace | default (dict)) }}

          {{- if and $resourceGroupId $logsEndpoint $metricsEndpoint $tracesEndpoint }}
          ---
          apiVersion: platform.example.org/v1alpha1
          kind: XAgentEnvironment
          status:
            resourceGroupId: {{ $resourceGroupId | quote }}
            logsEndpoint: {{ $logsEndpoint | quote }}
            metricsEndpoint: {{ $metricsEndpoint | quote }}
            tracesEndpoint: {{ $tracesEndpoint | quote }}
            modelEndpoint: {{ $modelEndpoint | quote }}
            serviceAccountName: {{ $serviceAccountName | quote }}
            namespace: {{ $namespace | quote }}
            clientId: {{ $clientId | quote }}
          {{- end }}

          {{- $observed := .observed.resources | default (dict) }}
          {{- $workspaceReady := eq (getResourceCondition "Ready" (get $observed "opentofu-workspace")).Status "True" }}
          {{- $existingSA := getComposedResource . "workload-service-account" }}
          
          {{- if and $namespace $clientId $serviceAccountName (or $workspaceReady $existingSA) }}
          ---
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: workload-service-account
          spec:
            providerConfigRef:
              kind: ClusterProviderConfig
              name: workload-kubernetes
            forProvider:
              manifest:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: {{ $serviceAccountName | quote }}
                  namespace: {{ $namespace | quote }}
                  annotations:
                    azure.workload.identity/client-id: {{ $clientId | quote }}
          {{- end }}
  - step: automatically-detect-ready
    functionRef:
      name: function-auto-ready