apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: agent-environment
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: XAgentEnvironment
  mode: Pipeline
  pipeline:
  - step: environment
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
          - type: Reference
            ref:
              name: workload
  - step: render-opentofu-workspace
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $env := index .context "apiextensions.crossplane.io/environment" }}
          apiVersion: opentofu.m.upbound.io/v1beta1
          kind: Workspace
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: opentofu-workspace
          spec:
            providerConfigRef:
              kind: ClusterProviderConfig
              name: provider-opentofu
            forProvider:
              source: Remote
              module: github.com/pauldotyu/platform//modules/agent-environment?ref=main
              vars:
              - key: team
                value: {{ .observed.composite.resource.spec.parameters.team | quote }}
              - key: project
                value: {{ .observed.composite.resource.spec.parameters.project | quote }}
              - key: environment
                value: {{ .observed.composite.resource.spec.parameters.environment | quote }}
              - key: location
                value: {{ .observed.composite.resource.spec.parameters.location | quote }}
              - key: requester_object_id
                value: {{ .observed.composite.resource.spec.parameters.requesterObjectId | quote }}
              - key: cost_center
                value: {{ .observed.composite.resource.spec.parameters.costCenter | quote }}
              - key: workload_cluster_id
                value: {{ $env.clusterId | quote }}
              - key: workload_cluster_location
                value: {{ $env.location | quote }}
          {{- $workspace := getComposedResource . "opentofu-workspace" }}
          {{- $resourceGroupId := dig "status" "atProvider" "outputs" "resource_group_id" "" ($workspace | default (dict)) }}
          {{- if $resourceGroupId }}
          ---
          apiVersion: platform.example.org/v1alpha1
          kind: XAgentEnvironment
          status:
            resourceGroupId: {{ $resourceGroupId | quote }}
          {{- end }}
  - step: automatically-detect-ready
    functionRef:
      name: function-auto-ready