apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: agent-environment
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: XAgentEnvironment
  mode: Pipeline
  pipeline:
  - step: environment
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
          - type: Reference
            ref:
              name: workload
  - step: render-opentofu-workspace
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      options: [ "missingkey=error" ]
      inline:
        template: |
          {{- $env := index .context "apiextensions.crossplane.io/environment" | default (dict) }}
          {{- range list "moduleRevision" "clusterId" "clusterOidcIssuerUrl" "location" "monitorWorkspaceId" "logAnalyticsWorkspaceId" "modelResourceId" "modelResourceName" }}
            {{- if eq (dig . "" $env) "" }}{{ fail (printf "EnvironmentConfig 'workload' is missing %q. Platform team: set it and re-sync." .) }}{{ end }}
          {{- end }}
          {{- if not (regexMatch "^[0-9a-f]{40}$|^v[0-9]+\\.[0-9]+\\.[0-9]+$" $env.moduleRevision) }}
            {{- fail (printf "moduleRevision %q must be a full commit SHA or a vX.Y.Z tag, not a branch." $env.moduleRevision) }}
          {{- end }}
          {{- if not (hasPrefix "https://" $env.clusterOidcIssuerUrl) }}
            {{- fail "clusterOidcIssuerUrl must be an https:// issuer URL." }}
          {{- end }}
          {{- $moduleRevision := $env.moduleRevision }}
          {{- $p := .observed.composite.resource.spec.parameters }}
          {{- $telemetryOnly := dig "telemetryOnly" (list) $p }}
          {{- range $telemetryOnly }}{{ if has . $p.agents }}{{ fail (printf "%s is in both agents and telemetryOnly." .) }}{{ end }}{{ end }}
          {{- $components := concat $p.agents $telemetryOnly }}
          {{- if eq $p.requesterObjectId "00000000-0000-0000-0000-000000000000" }}
            {{- fail "requesterObjectId is the placeholder value. Use the requester's real Entra object ID." }}
          {{- end }}
          {{- if gt (len (printf "%s-%s-%s" $p.team $p.project $p.environment)) 63 }}
            {{- fail "team-project-environment must be 63 characters or fewer to form a valid namespace name." }}
          {{- end }}
          apiVersion: opentofu.m.upbound.io/v1beta1
          kind: Workspace
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: opentofu-workspace
          spec:
            providerConfigRef:
              kind: ClusterProviderConfig
              name: provider-opentofu
            forProvider:
              source: Remote
              module: github.com/pauldotyu/platform//modules/agent-environment?ref={{ $moduleRevision }}
              remotePullPolicy: IfNotPresent
              varmap:
                agents: {{ $p.agents | toJson }}
                telemetry_only: {{ $telemetryOnly | toJson }}
                extra_tags: {{ dig "tags" (dict) $env | toJson }}
              vars:
              - key: team
                value: {{ $p.team | quote }}
              - key: project
                value: {{ $p.project | quote }}
              - key: environment
                value: {{ $p.environment | quote }}
              - key: size
                value: {{ dig "size" "small" $p | quote }}
              - key: location
                value: {{ $p.location | quote }}
              - key: requester_object_id
                value: {{ $p.requesterObjectId | quote }}
              - key: cost_center
                value: {{ $p.costCenter | quote }}
              - key: workload_cluster_id
                value: {{ $env.clusterId | quote }}
              - key: shared_cluster_oidc_issuer_url
                value: {{ $env.clusterOidcIssuerUrl | quote }}
              - key: shared_cluster_location
                value: {{ $env.location | quote }}
              - key: shared_monitor_workspace_id
                value: {{ $env.monitorWorkspaceId | quote }}
              - key: shared_log_analytics_workspace_id
                value: {{ $env.logAnalyticsWorkspaceId | quote }}
              - key: shared_model_resource_id
                value: {{ $env.modelResourceId | quote }}
              - key: shared_model_resource_name
                value: {{ $env.modelResourceName | quote }}
          {{- $workspace := getComposedResource . "opentofu-workspace" | default (dict) }}
          {{- $outputs := dig "status" "atProvider" "outputs" (dict) $workspace }}
          {{- $workspaceReady := false }}
          {{- $workspaceSynced := false }}
          {{- range (dig "status" "conditions" (list) $workspace) }}
            {{- if and (eq .type "Ready") (eq .status "True") }}{{ $workspaceReady = true }}{{ end }}
            {{- if and (eq .type "Synced") (eq .status "True") }}{{ $workspaceSynced = true }}{{ end }}
          {{- end }}
          {{- $required := list "resource_group_id" "namespace_name" "foundry_openai_base_url" "otel_logs_endpoint" "otel_metrics_endpoint" "otel_traces_endpoint" }}
          {{- $waiting := list }}
          {{- if not $workspaceSynced }}{{ $waiting = append $waiting "workspace: not synced" }}{{ end }}
          {{- if not $workspaceReady }}{{ $waiting = append $waiting "workspace: not ready" }}{{ end }}
          {{- range $required }}
            {{- if eq (dig . "" $outputs) "" }}{{ $waiting = append $waiting (printf "output: %s" .) }}{{ end }}
          {{- end }}
          {{- $clientIds := dig "agent_client_ids" (dict) $outputs }}
          {{- range $components }}
            {{- if eq (dig . "" $clientIds) "" }}{{ $waiting = append $waiting (printf "identity: %s" .) }}{{ end }}
           {{- end }}
          {{- $azureReady := eq (len $waiting) 0 }}
          {{- $namespace := dig "namespace_name" "" $outputs }}
          {{- range $agent := $components }}
            {{- $name := printf "sa-%s" $agent }}
            {{- $existing := getComposedResource $ $name }}
            {{- $ready := false }}
            {{- range (dig "status" "conditions" (list) ($existing | default (dict))) }}
              {{- if and (eq .type "Ready") (eq .status "True") }}{{ $ready = true }}{{ end }}
            {{- end }}
            {{- if not $ready }}{{ $waiting = append $waiting (printf "serviceaccount: %s" $agent) }}{{ end }}
            {{- if or $azureReady $existing }}
          ---
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $name }}
          spec:
            providerConfigRef:
              kind: ClusterProviderConfig
              name: workload-kubernetes
            forProvider:
              manifest:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: {{ $agent | quote }}
                  namespace: {{ $namespace | quote }}
                  annotations:
                    azure.workload.identity/client-id: {{ dig $agent "" $clientIds | quote }}
            {{- end }}
          {{- end }}
          {{- $existingCm := getComposedResource . "platform-context" }}
          {{- $cmReady := false }}
          {{- range (dig "status" "conditions" (list) ($existingCm | default (dict))) }}
            {{- if and (eq .type "Ready") (eq .status "True") }}{{ $cmReady = true }}{{ end }}
          {{- end }}
          {{- if not $cmReady }}{{ $waiting = append $waiting "configMap: platform-context" }}{{ end }}
          {{- if or $azureReady $existingCm }}
          ---
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: platform-context
          spec:
            providerConfigRef:
              kind: ClusterProviderConfig
              name: workload-kubernetes
            forProvider:
              manifest:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: platform-context
                  namespace: {{ $namespace | quote }}
                  labels:
                    app.kubernetes.io/managed-by: platform
                data:
                  OPENAI_BASE_URL: {{ dig "foundry_openai_base_url" "" $outputs | quote }}
                  OPENAI_CHAT_MODEL: {{ $env.modelDeploymentName | quote }}
                  OPENAI_AUTH_MODE: workload_identity
                  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
                  OTEL_EXPORTER_OTLP_AUTH_MODE: workload_identity
                  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ dig "otel_traces_endpoint" "" $outputs | quote }}
                  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: {{ dig "otel_logs_endpoint" "" $outputs | quote }}
                  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: {{ dig "otel_metrics_endpoint" "" $outputs | quote }}
                  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: DELTA
                  OTEL_RESOURCE_ATTRIBUTES: {{ printf "microsoft.applicationId=%s" (dig "app_insights_application_id" "" $outputs) | quote }}
                  OTEL_SERVICE_NAMESPACE: {{ $namespace | quote }}
                  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "true" # todo: make this configurable for prod
          {{- end }}
          {{- $platformReady := eq (len $waiting) 0}}
          {{- $delivery := dig "delivery" (dict) $p }}
          {{- $app := dict }}
          {{- if $delivery }}
            {{- $saValues := dict }}
            {{- range $components }}{{ $_ := set $saValues . (dict "name" . "create" false) }}{{ end }}
            {{- $appObj := getComposedResource . "argo-application" | default (dict) }}
            {{- $app = dig "status" "atProvider" "manifest" (dict) $appObj }}
            {{- $sync := dig "status" "sync" "status" "" $app }}
            {{- $health := dig "status" "health" "status" "" $app }}
            {{- if ne $sync "Synced" }}{{ $waiting = append $waiting (printf "delivery: sync %s" ($sync | default "pending")) }}{{ end }}
            {{- if ne $health "Healthy" }}{{ $waiting = append $waiting (printf "delivery: health %s" ($health | default "pending")) }}{{ end }}
            {{- if or $platformReady (getComposedResource . "argo-application") }}
          ---
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-project
          spec:
            providerConfigRef: {kind: ClusterProviderConfig, name: control-kubernetes}
            forProvider:
              manifest:
                apiVersion: argoproj.io/v1alpha1
                kind: AppProject
                metadata:
                  name: {{ $namespace }}
                  namespace: argocd
                spec:
                  sourceRepos: [{{ $delivery.repoUrl | quote }}]
                  destinations:
                    - name: worker
                      namespace: {{ $namespace | quote }}
                  clusterResourceWhitelist: []
                  namespaceResourceBlacklist:
                    - group: ""
                      kind: ServiceAccount
                    - group: ""
                      kind: ResourceQuota
                    - group: ""
                      kind: LimitRange
                    - group: networking.k8s.io
                      kind: NetworkPolicy
                    - group: rbac.authorization.k8s.io
                      kind: Role
                    - group: rbac.authorization.k8s.io
                      kind: RoleBinding
          ---
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: argo-application
          spec:
            providerConfigRef:
              kind: ClusterProviderConfig
              name: control-kubernetes
            readiness:
              policy: DeriveFromCelQuery
              celQuery: "has(object.status) && has(object.status.sync) && has(object.status.health) && object.status.sync.status == 'Synced' && object.status.health.status == 'Healthy'"
            forProvider:
              manifest:
                apiVersion: argoproj.io/v1alpha1
                kind: Application
                metadata:
                  name: {{ $namespace }}
                  namespace: argocd
                spec:
                  project: {{ $namespace }}
                  source:
                    repoURL: {{ $delivery.repoUrl | quote }}
                    path: {{ $delivery.path | quote }}
                    targetRevision: {{ dig "targetRevision" "main" $delivery | quote }}
                    helm:
                      valuesObject:
                        extraEnvFrom:
                          - configMapRef:
                              name: platform-context
                        secret:
                          create: false
                        workloadIdentity:
                          enabled: true
                          serviceAccount:
                            create: false
                          serviceAccounts: {{ $saValues | toJson }}
                  destination:
                    name: worker
                    namespace: {{ $namespace | quote }}
                  syncPolicy:
                    automated:
                      prune: true
                      selfHeal: true
                    retry:
                      limit: 5
                      backoff:
                        duration: 10s
                        factor: 2
                        maxDuration: 3m
            {{- end }}
          {{- end }}
          ---
          apiVersion: platform.example.org/v1alpha1
          kind: XAgentEnvironment
          status:
            provisioned: {{ eq (len $waiting) 0 }}
            waitingFor: {{ $waiting | toJson }}
            {{- if $azureReady }}
            binding:
              namespace: {{ $namespace | quote }}
              serviceAccounts: {{ $clientIds | toJson }}
              configMapName: platform-context
              resourceGroupId: {{ dig "resource_group_id" "" $outputs | quote }}
              appInsightsResourceId: {{ dig "app_insights_resource_id" "" $outputs | quote }}
              {{- if $delivery }}
              argoApplication: {{ $namespace | quote }}
              syncStatus: {{ dig "status" "sync" "status" "" $app | quote }}
              healthStatus: {{ dig "status" "health" "status" "" $app | quote }}
              {{- end }}
            {{- end }}
  - step: automatically-detect-ready
    functionRef:
      name: function-auto-ready