apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xagentenvironments.platform.example.org
spec:
  group: platform.example.org
  names:
    kind: XAgentEnvironment
    plural: xagentenvironments
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - parameters
            properties:
              parameters:
                type: object
                required:
                - name
                - location
                - requesterObjectId
                properties:
                  name:
                    type: string
                    pattern: '^[a-z0-9-]{1,60}$'
                  location:
                    type: string
                  requesterObjectId:
                    type: string
                    minLength: 1