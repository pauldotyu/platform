apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xagentenvironments.platform.example.org
spec:
  group: platform.example.org
  names:
    kind: XAgentEnvironment
    plural: xagentenvironments
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - parameters
            properties:
              parameters:
                type: object
                required:
                - team
                - project
                - environment
                - location
                - requesterObjectId
                - costCenter
                properties:
                  team:
                    type: string
                  project:
                    type: string
                  environment:
                    type: string
                  location:
                    type: string
                  requesterObjectId:
                    type: string
                    minLength: 1
                  costCenter:
                    type: string