apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xagentenvironments.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: XAgentEnvironment
    plural: xagentenvironments
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - parameters
            properties:
              parameters:
                type: object
                required:
                - team
                - project
                - environment
                - location
                - requesterObjectId
                - costCenter
                properties:
                  team:
                    type: string
                    minLength: 1
                    maxLength: 20
                    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
                  project:
                    type: string
                    minLength: 1
                    maxLength: 20
                    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
                  environment:
                    type: string
                    minLength: 1
                    maxLength: 20
                    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
                  size:
                    type: string
                    description: Namespace capacity tier. Maps to a ResourceQuota defined in the agent-environment module.
                    enum: [small, medium, large]
                    default: small
                  location:
                    type: string
                    enum: [westus3, eastus, centralus]
                  requesterObjectId:
                    type: string
                    pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
                  costCenter:
                    type: string
                    maxLength: 20
                    pattern: '^[a-zA-Z0-9]+(-[a-zA-Z0-9]+)*$'
                  agents:
                    type: array
                    description: Model-calling components. Each gets its own ServiceAccount and Azure identity with model and telemetry access.
                    default: [foundry]
                    minItems: 1
                    maxItems: 5
                    x-kubernetes-list-type: set
                    items:
                      type: string
                      pattern: '^[a-z]([a-z0-9-]{0,18}[a-z0-9])?$'
                  telemetryOnly:
                    type: array
                    description: Components that send telemetry but never call the model. Each gets its own ServiceAccount and an identity with telemetry access only.
                    default: []
                    maxItems: 5
                    x-kubernetes-list-type: set
                    items:
                      type: string
                      pattern: '^[a-z]([a-z0-9-]{0,18}[a-z0-9])?$'
                  delivery:
                    type: object
                    description: Optional. Helm chart in Git that the platform deploys into this environment.
                    required: [repoUrl, path]
                    properties:
                      repoUrl:
                        type: string
                        pattern: '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?$'
                      path:
                        type: string
                        description: Chart directory in the repo, for example deploy/helm/fourth-coffee.
                        pattern: '^[A-Za-z0-9_/.-]+$'
                      targetRevision:
                        type: string
                        default: main
                      expose:
                        type: object
                        description: Optional. Service the platform exposes at https://<namespace>.<apps domain>.
                        required: [service, port]
                        properties:
                          service:
                            type: string
                            pattern: '^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
          status:
            type: object
            properties:
              binding:
                type: object
                description: Everything an application needs to run in this environment. Present only when provisioned is true.
                properties:
                  namespace:
                    type: string
                    description: The namespace in which the workload resources are deployed.
                  serviceAccounts:
                    type: object
                    description: ServiceAccount name to Azure client ID. Set serviceAccountName on each component's pod to its key.
                    additionalProperties:
                      type: string
                  configMapName:
                    type: string
                    description: Add to each container with envFrom.configMapRef. Holds model and OpenTelemetry settings.
                  resourceGroupId:
                    type: string
                    description: The ID of the Azure resource group associated with this environment.
                  appInsightsResourceId:
                    type: string
                    description: The ID of the Azure Application Insights resource associated with this environment.
                  argoApplication:
                    type: string
                    description: The name of the Argo CD application associated with this environment.
                  syncStatus:
                    type: string
                    description: The sync status of the Argo CD application.
                  healthStatus:
                    type: string
                    description: The health status of the Argo CD application.
                  url:
                    type: string
                    description: The URL at which the platform exposes the service.
              provisioned:
                type: boolean
                description: True only when Azure resources are applied, every output is present, and the workload ServiceAccount exists.
              waitingFor:
                type: array
                description: What provisioning is still waiting on. Empty when provisioned.
                items:
                  type: string
