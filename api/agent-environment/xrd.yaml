apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xagentenvironments.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: XAgentEnvironment
    plural: xagentenvironments
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - parameters
            properties:
              parameters:
                type: object
                required:
                - team
                - project
                - environment
                - location
                - requesterObjectId
                - costCenter
                properties:
                  team:
                    type: string
                    minLength: 1
                    maxLength: 20
                    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
                  project:
                    type: string
                    minLength: 1
                    maxLength: 20
                    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
                  environment:
                    type: string
                    minLength: 1
                    maxLength: 20
                    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
                  location:
                    type: string
                    minLength: 1
                  requesterObjectId:
                    type: string
                    pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
                  costCenter:
                    type: string
                    minLength: 1
          status:
            type: object
            properties:
              provisioned:
                type: boolean
                description: True only when Azure resources are applied, every output is present, and the workload ServiceAccount exists.
              waitingFor:
                type: array
                description: What provisioning is still waiting on. Empty when provisioned.
                items:
                  type: string
              resourceGroupId:
                type: string
                description: The ID of the Azure resource group associated with this environment.
              logsEndpoint:
                type: string
                description: The endpoint for accessing logs related to this environment.
              metricsEndpoint:
                type: string
                description: The endpoint for accessing metrics related to this environment.
              tracesEndpoint:
                type: string
                description: The endpoint for accessing traces related to this environment.
              modelEndpoint:
                type: string
                description: The endpoint for accessing the model related to this environment.
              serviceAccountName:
                type: string
                description: The name of the workload ServiceAccount associated with this environment.
              namespace:
                type: string
                description: The namespace in which the workload resources are deployed.
              clientId:
                type: string
                description: The client ID used for authentication with Azure resources.
