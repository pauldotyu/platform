apiVersion: platform.example.org/v1alpha1
kind: XAgentEnvironment
metadata:
  name: fourthcoffee-barista-dev
  namespace: agent-environments
spec:
  parameters:
    team: "fourthcoffee"
    project: "barista"
    environment: "dev"
    size: "medium"
    location: "westus3"
    costCenter: "CC-143"
    requesterObjectId: "7002a869-11f9-4ac2-8cad-c16a09128b02"
    agents: ["concierge","ops-agent"]
    telemetryOnly: ["fourth-coffee-mcp"]
    delivery:
      repoUrl: "https://github.com/pauldotyu/fourth-coffee"
      path: "deploy/helm/fourth-coffee"
      targetRevision: "main"
      expose:
        service: "concierge"
        port: 80