apiVersion: platform.example.org/v1alpha1
kind: XAgentEnvironment
metadata:
  name: fc-barista-dev
  namespace: agent-environments
spec:
  parameters:
    team: "fc"
    project: "barista"
    environment: "dev"
    size: "medium"
    location: "westus3"
    costCenter: "CC-134"
    requesterObjectId: "2a095f4b-5382-4787-bcfa-1538b63a4320"
    agents: ["concierge","ops-agent"]
    telemetryOnly: ["fourth-coffee-mcp"]
    delivery:
      repoUrl: "https://github.com/pauldotyu/fourth-coffee"
      path: "deploy/helm/fourth-coffee"
      targetRevision: "main"
      expose:
        service: "concierge"
        port: 80