apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-api
  namespace: argocd
spec:
  description: Crossplane platform API definitions
  sourceRepos:
    - https://github.com/pauldotyu/crossplane-opentofu-demo.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: crossplane-system
  clusterResourceWhitelist:
    - group: apiextensions.crossplane.io
      kind: CompositeResourceDefinition
    - group: apiextensions.crossplane.io
      kind: Composition
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-api
  namespace: argocd
spec:
  project: platform-api
  source:
    repoURL: https://github.com/pauldotyu/crossplane-opentofu-demo.git
    targetRevision: main
    path: api
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
