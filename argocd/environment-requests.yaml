apiVersion: v1
kind: Namespace
metadata:
  name: environment-requests
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: environment-requests
  namespace: argocd
spec:
  description: Approved environment requests
  sourceRepos:
    - https://github.com/pauldotyu/crossplane-opentofu-demo.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: environment-requests
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: platform.example.org
      kind: XAgentEnvironment
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: environment-requests
  namespace: argocd
spec:
  project: environment-requests
  source:
    repoURL: https://github.com/pauldotyu/crossplane-opentofu-demo.git
    targetRevision: main
    path: requests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: environment-requests
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m