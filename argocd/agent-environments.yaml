apiVersion: v1
kind: Namespace
metadata:
  name: agent-environments
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: agent-environments
  namespace: argocd
spec:
  description: Approved agent environment requests
  sourceRepos:
    - https://github.com/pauldotyu/crossplane-opentofu-demo.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: agent-environments
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: platform.example.org
      kind: XAgentEnvironment
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-environments
  namespace: argocd
spec:
  project: agent-environments
  source:
    repoURL: https://github.com/pauldotyu/crossplane-opentofu-demo.git
    targetRevision: main
    path: requests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-environments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m